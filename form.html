<!DOCTYPE html>

<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>FORM VALIDATION</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="form.css">
    </head>
    <body>
       <div class="container">
        <form id="myform">
            <h2>REGISTER HERE</h2>
            <div class="form-group">
                <label>Name</label>
                <input type="text" placeholder="please enter your name" id="name">
                <small class="error" id="nameError"></small>

            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="text" placeholder="please enter your email" id="email">
                <small class="error" id="emailError"></small>

            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" placeholder="please enter your password" id="password">
                <small class="error" id="passwordError"></small>

            </div>
            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" placeholder="please enter your password" id="confirmPassword">
                <small class="error" id="confirmError"></small>
            </div> 
            
            <button type="submit">Submit</button>
        </form>

       </div>
        
    </body>
    <script src="form.js" async defer></script>
</html>
